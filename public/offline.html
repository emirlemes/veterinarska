<!doctype html>
<html lang="bs">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2e7658">
    <title>Nema internet veze | VetCare</title>
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: #f5f8f6;
        color: #1d3129;
        font: 16px/1.5 system-ui, sans-serif;
        text-align: center;
      }
      main { max-width: 420px; }
      h1 { margin-bottom: 8px; font-size: 24px; }
      p { color: #718078; }
      button {
        min-height: 48px;
        margin-top: 12px;
        padding: 0 20px;
        border: 0;
        border-radius: 10px;
        background: #2e7658;
        color: #fff;
        font: inherit;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Nema internet veze</h1>
      <p>Za pregled i čuvanje podataka potrebna je internet veza. Medicinski podaci nisu dostupni offline.</p>
      <button onclick="location.reload()">Pokušaj ponovo</button>
    </main>
  </body>
</html>
